<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yamzz Market</title><meta name="description" content="Marketplace JASTEB Yamzz Market"><style>
:root{--bg:#07111f;--card:#0d1b2d;--card2:#10233a;--line:#203752;--text:#eef6ff;--muted:#91a7bf;--blue:#2f8cff;--green:#31d49a;--red:#ff6176}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 20% 0,#10325c 0,#07111f 42%,#050b13 100%);color:var(--text);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92%);margin:auto}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17304b}.brand{font-weight:900;font-size:20px}.brand b{color:var(--blue)}.navlinks{display:flex;gap:16px;color:var(--muted);font-size:14px}.hero{padding:70px 0 35px}.hero h1{font-size:clamp(34px,6vw,60px);line-height:1;margin:0 0 16px}.hero p{color:var(--muted);max-width:650px;font-size:16px}.badge{display:inline-flex;padding:7px 11px;border:1px solid #245383;background:#0c2540;border-radius:99px;color:#73b7ff;font-size:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:linear-gradient(180deg,#0e2035,#0a1626);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px #0003}.product h3{margin:0 0 8px}.price{font-size:27px;font-weight:900;margin:14px 0}.muted{color:var(--muted)}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:white}.btn.secondary{background:#172b42}.btn.danger{background:#5b1e2b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form{display:grid;gap:12px}.input,select,textarea{width:100%;background:#071321;border:1px solid var(--line);color:white;border-radius:11px;padding:12px;font:inherit}.input:focus,select:focus,textarea:focus{outline:2px solid #2f8cff66}.section{padding:30px 0}.hidden{display:none!important}.notice{padding:13px 15px;border-radius:12px;background:#0d243b;border:1px solid #214a70;margin:12px 0}.success{border-color:#196b53;background:#0b2b23}.error{border-color:#7d2939;background:#30131b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.pill{padding:5px 9px;border-radius:99px;background:#172b42;color:#b8d2ee}.adminbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tab{white-space:nowrap}.footer{padding:45px 0;color:var(--muted);text-align:center}.qris{display:block;max-width:280px;width:100%;margin:15px auto;border-radius:15px;border:1px solid var(--line)}@media(max-width:650px){.navlinks a:nth-child(1){display:none}.hero{padding-top:45px}}
</style></head><body><header class="nav"><div class="wrap" style="display:flex;justify-content:space-between;width:100%"><a class="brand" href="/">Yamzz <b>Market</b></a><nav class="navlinks"><a href="/">Produk</a><a href="/status">Cek Transaksi</a><a href="/admin">Admin</a></nav></div></header><main class="wrap"><div id="app"></div></main><footer class="footer">© <span id="year"></span> Yamzz Market • JASTEB</footer><script>
const $=s=>document.querySelector(s), app=$('#app'); let CSRF=''; let SITE={};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({ok:false,message:'Response tidak valid'}));if(!r.ok)throw new Error(d.message||'Request gagal');return d}
async function csrf(){const d=await api('/api/csrf');CSRF=d.csrf}
const rupiah=n=>'Rp '+Number(n).toLocaleString('id-ID');
async function loadSite(){const d=await api('/api/site');SITE=d;document.title=d.settings.site_name||'JASTEB';return d}
function home(d){app.innerHTML=`<section class="hero"><span class="badge">JASTEB • ORDER ONLINE</span><h1>${esc(d.settings.site_name||'Yamzz Market')}</h1><p>${esc(d.settings.site_tagline||'Pesan paket dengan cepat, format data jelas, dan status transaksi dapat dicek kapan saja.')}</p></section><section class="section"><div class="row" style="justify-content:space-between;margin-bottom:16px"><div><h2 style="margin:0">Pilih Paket</h2><div class="muted">Produk tersinkron langsung dari database admin.</div></div><a class="btn secondary" href="/status">Cek transaksi</a></div><div class="grid">${d.products.map(p=>`<article class="card product"><span class="pill">${p.quota} Ress</span><h3>${esc(p.name)}</h3><div class="price">${rupiah(p.price)}</div><p class="muted">${esc(p.description||'Paket layanan JASTEB')}</p><button class="btn" onclick="buy(${p.id})">Beli Sekarang</button></article>`).join('')}</div></section>`}
function payment(p){app.innerHTML=`<section class="section"><a class="muted" href="/">← Kembali</a><div class="card" style="max-width:680px;margin:20px auto"><span class="badge">PEMBAYARAN QRIS PRIBADI</span><h2>${esc(p.name)}</h2><div class="price">${rupiah(p.price)}</div><div class="notice">${esc(SITE.settings.payment_note||'Bayar sesuai nominal transaksi. Setelah itu upload bukti pembayaran.')}</div>${SITE.settings.qris_image_url?`<div style="text-align:center"><p class="muted">Scan QRIS pribadi berikut</p><img class="qris" src="${esc(SITE.settings.qris_image_url)}" alt="QRIS pribadi"><p class="muted">Nominal: <b style="color:white">${rupiah(p.price)}</b></p></div>`:`<div class="notice error">QRIS belum diatur admin.</div>`}<form id="orderForm" class="form"><input class="input" name="name" placeholder="Nama pelanggan" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="whatsapp" placeholder="Nomor WhatsApp" required><textarea class="input" name="note" rows="3" placeholder="Catatan (opsional)"></textarea><button class="btn">Buat Pesanan & Lanjut Upload Bukti</button></form><div id="msg"></div></div></section>`;$('#orderForm').onsubmit=async e=>{e.preventDefault();try{await csrf();const f=new FormData(e.target),d=Object.fromEntries(f);d.product_id=p.id;d.csrf=CSRF;const r=await api('/api/order',{method:'POST',body:JSON.stringify(d)});e.target.classList.add('hidden');$('#msg').innerHTML=`<div class="notice success"><b>Pesanan berhasil dibuat.</b><br>Kode transaksi: <b>${esc(r.order_code)}</b><br>Total: <b>${rupiah(r.amount)}</b><br><br><b>Langkah terakhir:</b> upload bukti pembayaran di bawah ini. Admin akan memverifikasi pembayaran sebelum pesanan diproses.</div><form id="proofForm" class="form"><label><b>Bukti Pembayaran</b><span class="muted"> JPG, PNG, WEBP • maksimal 3 MB</span></label><input class="input" type="file" name="proof" accept="image/jpeg,image/png,image/webp" required><input type="hidden" name="order_code" value="${esc(r.order_code)}"><button class="btn">Upload Bukti Pembayaran</button></form><div id="proofMsg"></div>`;$('#proofForm').onsubmit=async ev=>{ev.preventDefault();try{const fd=new FormData(ev.target);const resp=await fetch('/api/order-proof',{method:'POST',headers:{'X-CSRF-Token':CSRF},body:fd});const out=await resp.json();if(!resp.ok)throw new Error(out.message||'Upload gagal');ev.target.classList.add('hidden');$('#proofMsg').innerHTML=`<div class="notice success"><b>Bukti pembayaran terkirim.</b><br>Status transaksi: menunggu verifikasi admin.<br>Simpan kode transaksi <b>${esc(r.order_code)}</b> untuk mengecek status.</div>`}catch(x){$('#proofMsg').innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}}catch(x){$('#msg').innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}}
async function buy(id){const p=SITE.products.find(x=>x.id==id);if(p)payment(p)}
function statusPage(){app.innerHTML=`<section class="section"><div class="card" style="max-width:650px;margin:35px auto"><span class="badge">CEK TRANSAKSI</span><h2>Cek Status Pesanan</h2><form id="statusForm" class="form"><input class="input" id="code" placeholder="Contoh JST-260901-A1B2C3" required><button class="btn">Cek Status</button></form><div id="statusResult"></div></div></section>`;$('#statusForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/order-status?code='+encodeURIComponent($('#code').value));const o=d.order;$('#statusResult').innerHTML=`<div class="notice success"><b>${esc(o.order_code)}</b><br>Produk: ${esc(o.product_name)}<br>Total: ${rupiah(o.amount)}<br>Status: <span class="pill">${esc(o.status)}</span></div>`}catch(x){$('#statusResult').innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}}
function login(){app.innerHTML=`<section class="section"><div class="card" style="max-width:430px;margin:35px auto"><span class="badge">ADMIN PANEL</span><h2>Login Admin</h2><form id="login" class="form"><input class="input" name="username" placeholder="Username" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn">Masuk</button></form><div id="loginMsg"></div></div></section>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await csrf();const d=Object.fromEntries(new FormData(e.target));d.csrf=CSRF;await api('/api/admin/login',{method:'POST',body:JSON.stringify(d)});admin()}catch(x){$('#loginMsg').innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}}
async function admin(){try{const d=await api('/api/admin/me');CSRF=d.csrf;adminPanel()}catch{login()}}
async function adminPanel(){app.innerHTML=`<section class="section"><div class="adminbar"><div><span class="badge">ADMIN</span><h2 style="margin:0">Dashboard</h2></div><button class="btn secondary" onclick="logout()">Keluar</button></div><div class="tabs"><button class="btn tab" onclick="adminProducts()">Produk</button><button class="btn secondary tab" onclick="adminOrders()">Transaksi</button><button class="btn secondary tab" onclick="adminSettings()">Setting</button></div><div id="adminContent"></div></section>`;adminProducts()}
async function adminProducts(){const d=await api('/api/admin/products');$('#adminContent').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3>Produk</h3><button class="btn" onclick="productForm()">+ Tambah</button></div><div class="tablewrap"><table class="table"><tr><th>Produk</th><th>Harga</th><th>Ress</th><th>Status</th><th>Aksi</th></tr>${d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${rupiah(p.price)}</td><td>${p.quota}</td><td>${p.active?'Aktif':'Nonaktif'}</td><td><button class="btn secondary" onclick='productForm(${JSON.stringify(p)})'>Edit</button> <button class="btn danger" onclick="delProduct(${p.id})">Hapus</button></td></tr>`).join('')}</table></div></div>`}
function productForm(p={}){$('#adminContent').innerHTML=`<div class="card"><h3>${p.id?'Edit':'Tambah'} Produk</h3><form id="pf" class="form"><input class="input" name="name" value="${esc(p.name||'')}" placeholder="10K 100 Ress" required><input class="input" name="price" type="number" value="${p.price||''}" placeholder="10000" required><input class="input" name="quota" type="number" value="${p.quota||''}" placeholder="100"><textarea class="input" name="description" placeholder="Deskripsi">${esc(p.description||'')}</textarea><label><input type="checkbox" name="active" ${p.active!==false?'checked':''}> Aktif</label><div class="row"><button class="btn">Simpan</button><button type="button" class="btn secondary" onclick="adminProducts()">Batal</button></div></form></div>`;$('#pf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.id=p.id||0;d.active=e.target.active.checked;d.csrf=CSRF;await api('/api/admin/product',{method:'POST',body:JSON.stringify(d)});adminProducts()}}
async function delProduct(id){if(!confirm('Hapus produk ini?'))return;await api('/api/admin/product-delete',{method:'POST',body:JSON.stringify({id,csrf:CSRF})});adminProducts()}
async function adminOrders(){const d=await api('/api/admin/orders');$('#adminContent').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3>Transaksi Terbaru</h3><button class="btn secondary" onclick="adminOrders()">Refresh</button></div><div class="tablewrap"><table class="table"><tr><th>Kode</th><th>Pelanggan</th><th>Produk</th><th>Total</th><th>Bukti</th><th>Status</th><th>Aksi</th></tr>${d.orders.map(o=>`<tr><td><b>${esc(o.order_code)}</b><br><span class="muted">${esc(o.created_at||'')}</span></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.whatsapp)}</span><br><span class="muted">${esc(o.email)}</span></td><td>${esc(o.product_name)}</td><td>${rupiah(o.amount)}</td><td>${o.has_proof?`<button class="btn secondary" onclick="viewProof('${esc(o.order_code)}')">Lihat Bukti</button>`:'<span class="muted">Belum upload</span>'}</td><td><span class="pill">${esc(o.status)}</span></td><td>${o.has_proof&&o.status==='pending'?`<div class="row"><button class="btn" onclick="verifyOrder('${esc(o.order_code)}','paid')">✓ Verifikasi</button><button class="btn danger" onclick="verifyOrder('${esc(o.order_code)}','cancelled')">Tolak</button></div>`:`<select onchange="setStatus('${esc(o.order_code)}',this.value)">${['pending','paid','processing','completed','cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>`}</td></tr>`).join('')}</table></div></div>`} 
async function viewProof(code){try{const d=await api('/api/admin/order-proof?code='+encodeURIComponent(code));const w=window.open('','_blank','width=500,height=700');if(!w){alert('Izinkan popup browser untuk melihat bukti.');return}w.document.write('<title>Bukti '+esc(code)+'</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}img{max-width:100%;max-height:85vh;border-radius:12px}</style><h3>'+esc(code)+'</h3><img src="'+d.proof+'">');w.document.close()}catch(x){alert(x.message)}}
async function verifyOrder(code,status){const text=status==='paid'?'Verifikasi pembayaran ini sebagai LUNAS?':'Tolak transaksi ini?';if(!confirm(text))return;await setStatus(code,status);adminOrders()}
async function setStatus(code,status){await api('/api/admin/order-status',{method:'POST',body:JSON.stringify({order_code:code,status,csrf:CSRF})})}
async function adminSettings(){const d=await api('/api/admin/settings');const s=d.settings;$('#adminContent').innerHTML=`<div class="card"><h3>Setting Website</h3><form id="sf" class="form"><input class="input" name="site_name" value="${esc(s.site_name||'')}" placeholder="Nama website"><input class="input" name="site_tagline" value="${esc(s.site_tagline||'')}" placeholder="Tagline"><input class="input" name="contact_whatsapp" value="${esc(s.contact_whatsapp||'')}" placeholder="WhatsApp admin"><input class="input" name="contact_email" value="${esc(s.contact_email||'')}" placeholder="Email admin"><textarea class="input" name="payment_note" rows="4" placeholder="Instruksi pembayaran">${esc(s.payment_note||'')}</textarea><button class="btn">Simpan Setting</button></form><div id="sm"></div><hr style="border-color:var(--line);margin:25px 0"><h3>QRIS Pribadi</h3><p class="muted">Upload gambar QRIS pribadi yang akan tampil di halaman pembayaran. File maksimal 3 MB.</p>${s.qris_image_url?`<img class="qris" src="${esc(s.qris_image_url)}" alt="QRIS saat ini">`:'<div class="notice">Belum ada QRIS yang diupload.</div>'}<form id="qrisForm" class="form"><input class="input" type="file" name="qris" accept="image/jpeg,image/png,image/webp" required><button class="btn">Upload / Ganti QRIS</button></form><div id="qrisMsg"></div></div>`;$('#sf').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.csrf=CSRF;await api('/api/admin/settings',{method:'POST',body:JSON.stringify(d)});$('#sm').innerHTML='<div class="notice success">Setting tersimpan.</div>';loadSite()}catch(x){$('#sm').innerHTML='<div class="notice error">'+esc(x.message)+'</div>'}};$('#qrisForm').onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(e.target);const r=await fetch('/api/admin/qris-upload',{method:'POST',headers:{'X-CSRF-Token':CSRF},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.message||'Upload gagal');$('#qrisMsg').innerHTML='<div class="notice success">QRIS berhasil diperbarui.</div>';setTimeout(adminSettings,300)}catch(x){$('#qrisMsg').innerHTML='<div class="notice error">'+esc(x.message)+'</div>'}}}
async function logout(){await api('/api/admin/logout',{method:'POST',body:JSON.stringify({csrf:CSRF})});location.href='/admin'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function boot(){document.querySelector('#year').textContent=new Date().getFullYear();const p=location.pathname;if(p==='/admin'||p==='/admin/')return admin();if(p==='/status')return statusPage();try{const d=await loadSite();home(d)}catch(e){app.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
boot();
</script></body></html>
